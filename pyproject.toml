[project]
name = "cadodo-v620-fleet-engine"
version = "0.1.0"
description = "Open-source inference engine + fleet control app for the Radeon Pro V620 (gfx1031), llama.cpp backend, up to 16 slots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # line length handled separately; keep CI quiet on long doc lines
